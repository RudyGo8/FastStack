# ============================================
# FastStack 开发环境基础设施（PostgreSQL + pgvector / Redis）
# 使用方式（仓库根目录）:
#   docker compose -p faststack-dev --project-directory docker -f docker/compose.dev.yaml up -d
# 通常由 ./run.sh 调用，无需手工执行
# 其它服务按需启用:
#   docker compose -p faststack-dev --project-directory docker -f docker/compose.dev.yaml --profile milvus up -d
# 注意: 数据落在 docker/volumes/dev/，与生产 DATA_DIR 完全隔离
# ============================================

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: faststack-dev-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: faststack
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # PostgreSQL 18 的 PGDATA 位于 /var/lib/postgresql/18/docker，挂载父目录
      - "./volumes/dev/postgres:/var/lib/postgresql"
    networks:
      - faststack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: faststack-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - "./volumes/dev/redis:/data"
    networks:
      - faststack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── 以下不随默认 Dev 栈启动，按需 --profile 启用 ──

  # MySQL 兼容栈：仅供存量项目联调或迁移演练
  mysql:
    profiles: ["legacy-mysql"]
    image: mysql:8.0
    container_name: faststack-dev-mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=faststack
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - "./volumes/dev/mysql:/var/lib/mysql"
    networks:
      - faststack-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Milvus 全家桶：默认向量方案已是 pgvector，仅供仍依赖 Milvus 的项目启用
  etcd:
    profiles: ["milvus"]
    container_name: faststack-dev-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - "./volumes/dev/etcd:/etcd"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - faststack-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    profiles: ["milvus"]
    container_name: faststack-dev-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - "./volumes/dev/minio:/minio_data"
    command: minio server /minio_data --console-address ":9001"
    networks:
      - faststack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    profiles: ["milvus"]
    container_name: faststack-dev-milvus
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - "./volumes/dev/milvus:/var/lib/milvus"
    networks:
      - faststack-network
    ports:
      - "19531:19530"
      - "9092:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  attu:
    profiles: ["milvus"]
    container_name: faststack-dev-attu
    image: zilliz/attu:v2.5.11
    environment:
      - MILVUS_URL=milvus:19530
      - PORT=3000
    ports:
      - "8082:3000"
    networks:
      - faststack-network
    depends_on:
      - milvus

networks:
  faststack-network:
    driver: bridge
