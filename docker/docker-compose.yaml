# ============================================
# FastStack 生产全栈 Compose
# 使用方式:
#   cp .env.example .env && 编辑 .env
#   ../deploy.sh             （推荐，会做前置检查）
#   或 docker compose --env-file .env up -d
# 数据统一落在 DATA_DIR（默认 ./volumes/prod），与仓库和发布文件隔离
# ============================================

services:
  # ==================== 数据库服务 ====================
  postgres:
    container_name: faststack-postgres
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: "${DATABASE_USER:?错误: 请设置 DATABASE_USER 环境变量}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?错误: 请设置 DATABASE_PASSWORD 环境变量}"
      POSTGRES_DB: "${DATABASE_NAME:-faststack}"
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 的 PGDATA 位于 /var/lib/postgresql/18/docker，挂载父目录
      - "${DATA_DIR:-./volumes/prod}/postgres:/var/lib/postgresql"
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  # MySQL 兼容栈：仅存量 MySQL 项目需要时启用
  mysql:
    profiles: ["legacy-mysql"]
    container_name: faststack-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?错误: 请设置 MYSQL_ROOT_PASSWORD 环境变量}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-faststack}"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - "${DATA_DIR:-./volumes/prod}/mysql:/var/lib/mysql"
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ==================== Redis 服务 ====================
  redis:
    container_name: faststack-redis
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - "${DATA_DIR:-./volumes/prod}/redis:/data"
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:?错误: 请设置 REDIS_PASSWORD 环境变量}
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  # ==================== 后端服务 ====================
  backend:
    container_name: faststack-backend
    build:
      context: ../
      dockerfile: ./docker/backend/Dockerfile
      args:
        DEPLOY_ENV: "${DEPLOY_ENV:-prod}"
    image: "faststack-backend:${BACKEND_IMAGE_TAG:-0.1.0}"
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      # 运行环境，对应 backend/env/.env.{dev,prod}
      ENVIRONMENT: "${DEPLOY_ENV:-prod}"
      DATABASE_TYPE: "postgres"
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      DATABASE_USER: "${DATABASE_USER}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      DATABASE_NAME: "${DATABASE_NAME:-faststack}"
      # 向量检索：需要 pgvector 时在 .env 里设为 true
      VECTOR_STORE_ENABLE: "${VECTOR_STORE_ENABLE:-false}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB_NAME: "1"
      REDIS_ENABLE: "true"
      LOGGER_LEVEL: "${LOGGER_LEVEL:-INFO}"
      # 信任反向代理（nginx）传来的 X-Forwarded-Proto/For：否则 prod 的
      # HTTPSRedirectMiddleware 会把 https 请求误判为 http 造成 301 循环
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8001"
    volumes:
      # 用户上传文件持久化（种子节点 host=static/upload），必须挂载
      - "${DATA_DIR:-./volumes/prod}/uploads:/home/static/upload"
      - "${DATA_DIR:-./volumes/prod}/logs:/home/logs"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; req = urllib.request.Request(\"http://localhost:8001/api/v1/monitor/health/check\", headers={\"X-Forwarded-Proto\": \"https\"}); urllib.request.urlopen(req, timeout=5)' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m

  # ==================== Nginx 服务 ====================
  nginx:
    container_name: faststack-nginx
    image: nginx:1.25-alpine
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/web:/usr/share/nginx/html/web:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/app:/usr/share/nginx/html/app:ro
      - ./nginx/docs:/usr/share/nginx/html/docs:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m

# ==================== 网络 ====================
networks:
  app_network:
    driver: bridge
