<svg
  viewBox="0 0 400 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- 主蓝色渐变 -->
    <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8FB6FF"/>
      <stop offset="100%" stop-color="#4F6EF7"/>
    </linearGradient>

    <!-- AI 方块渐变 -->
    <linearGradient id="aiGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79A7FF"/>
      <stop offset="100%" stop-color="#4169F6"/>
    </linearGradient>

    <!-- 卡片渐变 -->
    <linearGradient id="cardGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F7FF"/>
    </linearGradient>

    <!-- 底座渐变 -->
    <linearGradient id="platformGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF1FF"/>
      <stop offset="100%" stop-color="#BED2FF"/>
    </linearGradient>

    <!-- 阴影 -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="8"
        flood-color="#5577CC"
        flood-opacity="0.15"
      />
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="5"
        flood-color="#5577CC"
        flood-opacity="0.12"
      />
    </filter>
  </defs>

  <!-- ================= 背景连接线 ================= -->

  <path
    d="M99 124C123 93 151 86 181 102"
    stroke="#98B7FF"
    stroke-width="1.5"
    stroke-dasharray="4 5"
  />

  <path
    d="M218 101C251 84 281 94 304 122"
    stroke="#98B7FF"
    stroke-width="1.5"
    stroke-dasharray="4 5"
  />

  <path
    d="M103 192C133 218 159 216 184 197"
    stroke="#98B7FF"
    stroke-width="1.5"
    stroke-dasharray="4 5"
  />

  <path
    d="M218 197C246 219 277 214 300 190"
    stroke="#98B7FF"
    stroke-width="1.5"
    stroke-dasharray="4 5"
  />

  <!-- 小节点 -->
  <circle cx="99" cy="124" r="4" fill="#5680F8"/>
  <circle cx="304" cy="122" r="4" fill="#5680F8"/>
  <circle cx="103" cy="192" r="4" fill="#5680F8"/>
  <circle cx="300" cy="190" r="4" fill="#5680F8"/>

  <!-- ================= 中央 AI ================= -->

  <!-- 光环 -->
  <ellipse
    cx="200"
    cy="150"
    rx="57"
    ry="29"
    stroke="#ADC6FF"
    stroke-width="1.5"
    opacity="0.55"
  />

  <ellipse
    cx="200"
    cy="150"
    rx="72"
    ry="39"
    stroke="#D0DFFF"
    stroke-width="1"
    opacity="0.55"
  />

  <!-- 底座 -->
  <g filter="url(#shadow)">
    <path
      d="M161 163L200 143L239 163L200 184L161 163Z"
      fill="url(#platformGradient)"
    />

    <path
      d="M161 163V174L200 195V184L161 163Z"
      fill="#C4D6FF"
    />

    <path
      d="M239 163V174L200 195V184L239 163Z"
      fill="#A8C2FF"
    />
  </g>

  <!-- AI Cube -->
  <g filter="url(#softShadow)">
    <!-- 正面 -->
    <rect
      x="175"
      y="113"
      width="50"
      height="50"
      rx="10"
      fill="url(#aiGradient)"
    />

    <!-- 顶部高光 -->
    <path
      d="M180 116L200 105L220 116L200 127L180 116Z"
      fill="#91B5FF"
      opacity="0.9"
    />

    <!-- 侧边 -->
    <path
      d="M225 113L238 121V152L225 163V113Z"
      fill="#365BE9"
      opacity="0.75"
    />

    <text
      x="200"
      y="145"
      text-anchor="middle"
      font-size="20"
      font-weight="700"
      font-family="Arial, sans-serif"
      fill="white"
    >
      AI
    </text>
  </g>

  <!-- ================= 销售 ================= -->

  <g filter="url(#softShadow)">
    <rect
      x="42"
      y="96"
      width="76"
      height="72"
      rx="12"
      fill="url(#cardGradient)"
      stroke="#E0E9FF"
    />

    <text
      x="80"
      y="116"
      text-anchor="middle"
      font-size="12"
      font-weight="600"
      font-family="Microsoft YaHei, Arial"
      fill="#3555A8"
    >
      销售
    </text>

    <rect x="58" y="142" width="7" height="12" rx="2" fill="#A8C4FF"/>
    <rect x="70" y="135" width="7" height="19" rx="2" fill="#82A8FF"/>
    <rect x="82" y="127" width="7" height="27" rx="2" fill="#648EFF"/>
    <rect x="94" y="118" width="7" height="36" rx="2" fill="#4F6EF7"/>
  </g>

  <!-- ================= 预测 ================= -->

  <g filter="url(#softShadow)">
    <rect
      x="282"
      y="84"
      width="76"
      height="72"
      rx="12"
      fill="url(#cardGradient)"
      stroke="#E0E9FF"
    />

    <text
      x="320"
      y="104"
      text-anchor="middle"
      font-size="12"
      font-weight="600"
      font-family="Microsoft YaHei, Arial"
      fill="#3555A8"
    >
      预测
    </text>

    <path
      d="M296 137L306 127L316 131L328 115L343 107"
      stroke="#4F6EF7"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle cx="296" cy="137" r="3" fill="#4F6EF7"/>
    <circle cx="306" cy="127" r="3" fill="#4F6EF7"/>
    <circle cx="316" cy="131" r="3" fill="#4F6EF7"/>
    <circle cx="328" cy="115" r="3" fill="#4F6EF7"/>
    <circle cx="343" cy="107" r="3" fill="#4F6EF7"/>
  </g>

  <!-- ================= 供应 ================= -->

  <g filter="url(#softShadow)">
    <rect
      x="58"
      y="190"
      width="76"
      height="72"
      rx="12"
      fill="url(#cardGradient)"
      stroke="#E0E9FF"
    />

    <text
      x="96"
      y="247"
      text-anchor="middle"
      font-size="12"
      font-weight="600"
      font-family="Microsoft YaHei, Arial"
      fill="#3555A8"
    >
      供应
    </text>

    <!-- 立方体 -->
    <path
      d="M96 206L110 214L96 222L82 214L96 206Z"
      fill="#79A2FF"
    />
    <path
      d="M82 214L96 222V238L82 230V214Z"
      fill="#507BF0"
    />
    <path
      d="M110 214L96 222V238L110 230V214Z"
      fill="#3563E8"
    />
  </g>

  <!-- ================= 库存 ================= -->

  <g filter="url(#softShadow)">
    <rect
      x="266"
      y="188"
      width="76"
      height="72"
      rx="12"
      fill="url(#cardGradient)"
      stroke="#E0E9FF"
    />

    <text
      x="304"
      y="245"
      text-anchor="middle"
      font-size="12"
      font-weight="600"
      font-family="Microsoft YaHei, Arial"
      fill="#3555A8"
    >
      库存
    </text>

    <!-- 数据库 -->
    <ellipse
      cx="304"
      cy="208"
      rx="15"
      ry="6"
      fill="#78A1FF"
    />

    <path
      d="M289 208V226C289 229.5 295.7 232 304 232C312.3 232 319 229.5 319 226V208"
      fill="#5D86F6"
    />

    <ellipse
      cx="304"
      cy="216"
      rx="15"
      ry="6"
      stroke="#AFC6FF"
      stroke-width="1.5"
    />

    <ellipse
      cx="304"
      cy="226"
      rx="15"
      ry="6"
      stroke="#AFC6FF"
      stroke-width="1.5"
    />
  </g>

  <!-- ================= 装饰小点 ================= -->

  <circle cx="145" cy="60" r="3" fill="#C6D6FF"/>
  <circle cx="254" cy="58" r="4" fill="#D3DFFF"/>
  <circle cx="355" cy="184" r="3" fill="#BDD0FF"/>
  <circle cx="32" cy="180" r="4" fill="#D4E0FF"/>

  <circle
    cx="52"
    cy="60"
    r="13"
    stroke="#D8E4FF"
    stroke-width="2"
  />
</svg>