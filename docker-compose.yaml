# ============================================
# 兼容入口：等价于 docker/compose.dev.yaml
#
# 推荐用 ./run.sh（会带上项目名与 project-directory）。
# 若需手工操作，两种写法等价：
#   docker compose up -d
#   docker compose -p faststack-dev --project-directory docker -f docker/compose.dev.yaml up -d
#
# 生产全栈部署用 docker/docker-compose.yaml + ./deploy.sh
# ============================================

name: faststack-dev

include:
  - path: docker/compose.dev.yaml
    project_directory: docker
