# ============================================
# FastStack 开发环境基础设施（MySQL / Redis / Milvus 全家桶）
# 使用方式: 在仓库根目录执行 docker compose up -d
# 生产全栈部署用 docker/docker-compose.yaml + ./deploy.sh
# 注意: 容器名与端口和 fva-* 栈一致，别处再跑同名栈会冲突
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: fva-mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=faststack
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/mysql:/var/lib/mysql"
    networks:
      - fva-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: fva-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/redis:/data"
    networks:
      - fva-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s

  etcd:
    container_name: fva-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/etcd:/etcd"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - fva-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: fva-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/minio:/minio_data"
    command: minio server /minio_data --console-address ":9001"
    networks:
      - fva-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: fva-milvus
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/milvus:/var/lib/milvus"
    networks:
      - fva-network
    ports:
      - "19531:19530"
      - "9092:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  attu:
    container_name: fva-attu
    image: zilliz/attu:v2.5.11
    environment:
      - MILVUS_URL=milvus:19530
      - PORT=3000
    ports:
      - "8082:3000"
    networks:
      - fva-network
    depends_on:
      - milvus

networks:
  fva-network:
    driver: bridge
