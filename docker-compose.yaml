# ============================================
# FastStack 开发环境基础设施
# 使用方式: 在仓库根目录执行 docker compose up -d
#   默认只启动 PostgreSQL(+pgvector) / Redis
#   按需启用其它服务: docker compose --profile milvus up -d
# 生产全栈部署用 docker/docker-compose.yaml + ./deploy.sh
# 注意: 容器名与端口和 fast-* 栈一致，别处再跑同名栈会冲突
# ============================================

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: fast-postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=faststack
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/postgres:/var/lib/postgresql"
    networks:
      - fast-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: fast-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/redis:/data"
    networks:
      - fast-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── 以下均不再随默认栈启动，按需 --profile 启用 ──

  # MySQL 兼容栈：仅保留旧项目/迁移演练时使用
  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    container_name: fast-mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=faststack
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/mysql:/var/lib/mysql"
    networks:
      - fast-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Milvus 全家桶：默认向量方案已改为 pgvector，仅供仍需 Milvus 的项目启用
  etcd:
    profiles: ["milvus"]
    container_name: fast-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/etcd:/etcd"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - fast-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    profiles: ["milvus"]
    container_name: fast-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/minio:/minio_data"
    command: minio server /minio_data --console-address ":9001"
    networks:
      - fast-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    profiles: ["milvus"]
    container_name: fast-milvus
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - "${DOCKER_VOLUME_DIRECTORY:-./volumes}/milvus:/var/lib/milvus"
    networks:
      - fast-network
    ports:
      - "19531:19530"
      - "9092:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  attu:
    profiles: ["milvus"]
    container_name: fast-attu
    image: zilliz/attu:v2.5.11
    environment:
      - MILVUS_URL=milvus:19530
      - PORT=3000
    ports:
      - "8082:3000"
    networks:
      - fast-network
    depends_on:
      - milvus

networks:
  fast-network:
    driver: bridge
